services:
  llama:
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    restart: unless-stopped
    volumes:
      - ${LLAMA_MODELS_DIR:-./models}:/models:ro,Z
    command:
      - -m
      - /models/${LLAMA_MODEL_FILE:-Qwen3.5-2B-UD-Q6_K_XL.gguf}
      - --alias
      - ${LLAMA_MODEL:-Qwen3.5-2B}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - ${LLAMA_CTX_SIZE:-8192}
      - --parallel
      - "1"
      - --cache-prompt
      - --jinja
      - --chat-template-kwargs
      - '{"enable_thinking":false}'
      - --n-predict
      - "256"
      - --n-gpu-layers
      - ${LLAMA_N_GPU_LAYERS:-0}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s

  embedding:
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    restart: unless-stopped
    volumes:
      - ${LLAMA_MODELS_DIR:-./models}:/models:ro,Z
    command:
      - -m
      - /models/${EMBEDDING_MODEL_FILE:-Qwen3-Embedding-0.6B-Q8_0.gguf}
      - --alias
      - ${EMBEDDING_MODEL:-Qwen3-Embedding-0.6B}
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --ctx-size
      - ${EMBEDDING_CTX_SIZE:-4096}
      - --parallel
      - "1"
      - --embedding
      - --pooling
      - last
      - --n-gpu-layers
      - ${EMBEDDING_N_GPU_LAYERS:-0}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LLAMA_BASE_URL: http://llama:8080
      EMBEDDING_BASE_URL: http://embedding:8081
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      llama:
        condition: service_healthy
      embedding:
        condition: service_healthy
