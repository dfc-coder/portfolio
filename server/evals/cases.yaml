        const hasRust = rustProjects.some((name) => texts.some((text) => text.includes(`"name": "${name}`) && text.includes('"Rust"')));
        return {
          pass: hasGo && hasRust,
          score: (Number(hasGo) + Number(hasRust)) / 2,
          reason: hasGo && hasRust ? "Retrieved both Go and Rust project evidence" : "Missing Go and/or Rust project evidence"
        };
    - type: llm-rubric
