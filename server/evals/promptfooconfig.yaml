# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: Portfolio agent behavioral evaluation

prompts:
  - "{{query}}"

providers:
  - id: http
    label: portfolio-agent
    config:
      url: http://api:8000/v1/chat/stream
      method: POST
      headers:
        Content-Type: application/json
        x-agent-diagnostics-token: "{{ env.AGENT_DIAGNOSTICS_TOKEN }}"
      body:
        message: "{{prompt}}"
        context: []
      transformResponse: file://sse-transform.js

defaultTest:
  options:
    provider:
      id: openai:chat:Qwen3.5-4B
      label: local-eval-judge
      config:
        apiBaseUrl: http://llama:8080/v1
        apiKeyRequired: false
        useDefaultApiKey: false
        temperature: 0
        max_tokens: 512
        showThinking: false

tests:
  - file://cases.yaml

evaluateOptions:
  maxConcurrency: 1
  cache: false
  timeoutMs: 180000

sharing: false
writeLatestResults: true
