# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: Portfolio agent behavioral evaluation

prompts:
  - "{{query}}"

providers:
  - id: http
    label: portfolio-agent
    config:
      url: http://api:8000/v1/chat/stream
      method: POST
      headers:
        Content-Type: application/json
        x-agent-diagnostics-token: "{{ env.AGENT_DIAGNOSTICS_TOKEN }}"
      body:
        message: "{{prompt}}"
        context: []
      transformResponse: file://sse-transform.js

defaultTest:
  options:
    provider:
      id: openai:responses:gpt-5.6-luna
      label: cloud-eval-judge
      config:
        reasoning:
          effort: low
        max_output_tokens: 512
        store: false
        # Provider-native prompt caching. This is independent from Promptfoo's
        # result cache, which stays disabled so every eval executes fresh calls.
        prompt_cache_key: portfolio-eval-judge-v1
        prompt_cache_options:
          mode: implicit
          ttl: 30m

tests:
  - file://cases.yaml

evaluateOptions:
  # Keep target-agent requests serial because the local Qwen server runs with --parallel 1.
  # Model-graded assertions use the independent cloud judge and have their own concurrency limit.
  maxConcurrency: 1
  cache: false

sharing: false
writeLatestResults: true
