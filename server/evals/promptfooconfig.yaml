# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: Portfolio agent behavioral evaluation

prompts:
  - "{{query}}"

providers:
  - id: http
    label: portfolio-agent
    config:
      url: http://api:8000/v1/chat/stream
      method: POST
      headers:
        Content-Type: application/json
        x-agent-diagnostics-token: "{{ env.AGENT_DIAGNOSTICS_TOKEN }}"
      body:
        message: "{{prompt}}"
        context: []
      transformResponse: file://sse-transform.js

defaultTest:
  options:
    # One semantic judge call per case. The rubric sees only answer + retrieved
    # context; tool selection and retrieval coverage stay deterministic.
    rubricPrompt: file://judge-rubric.json
    provider:
      id: openai:responses:gpt-5.6-luna
      label: cloud-eval-judge
      config:
        reasoning:
          effort: low
        max_output_tokens: 256
        store: false
        # GPT-5.6 explicit caching stops the cache write at the reusable judge
        # policy breakpoint in judge-rubric.json. Case-specific data stays uncached.
        prompt_cache_key: portfolio-eval-judge-v2
        prompt_cache_options:
          mode: explicit
          ttl: 30m

tests:
  - file://cases.yaml

evaluateOptions:
  # Keep target-agent requests serial because the local Qwen server runs with --parallel 1.
  maxConcurrency: 1
  cache: false

sharing: false
writeLatestResults: true
