name: Portfolio Assistant CI

on:
  push:
    branches:
      - develop
    paths:
      - "server/**"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/portfolio-assistant.yml"
  pull_request:
    branches:
      - develop
    paths:
      - "server/**"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/portfolio-assistant.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Install backend
        run: python -m pip install -e './server[test]'
      - name: Compile backend
        working-directory: server
        run: python -m compileall -q app tests
      - name: Run backend tests
        working-directory: server
        env:
          PYTHONPATH: .
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frontend
        run: pnpm install --frozen-lockfile
      - name: Run visual contract tests
        run: pnpm test:visual
      - name: Typecheck and build frontend
        run: pnpm build
