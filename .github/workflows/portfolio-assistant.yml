name: Portfolio Assistant CI

on:
  push:
    branches:
      - develop
    paths:
      - "server/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/portfolio-assistant.yml"
  pull_request:
    branches:
      - develop
    paths:
      - "server/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/portfolio-assistant.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv
      - uses: actions/cache@v4
        with:
          path: server/models
          key: portfolio-agent-runtime-qwen35-4b-unsloth-ud-q4-xl-embedding-q8-v1
          save-always: true
      - name: Configure local evaluation
        working-directory: server
        run: |
          cp .env.example .env
          sed -i 's/^AGENT_DIAGNOSTICS_TOKEN=.*/AGENT_DIAGNOSTICS_TOKEN=ci-eval/' .env
      - name: Verify backend and agent
        working-directory: server
        run: make install verify ENGINE=docker
      - name: Print container logs on failure
        if: failure()
        working-directory: server
        run: docker compose logs --no-color --tail=300 || true
      - name: Stop stack
        if: always()
        working-directory: server
        run: docker compose down || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frontend
        run: pnpm install --frozen-lockfile
      - name: Run visual contract tests
        run: pnpm test:visual
      - name: Typecheck and build frontend
        run: pnpm build
