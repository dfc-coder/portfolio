name: Business Representative CI

on:
  push:
    branches:
      - agent/chapter-05-jarvis-ui
    paths:
      - "server/**"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/business-representative.yml"
  pull_request:
    paths:
      - "server/**"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/business-representative.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Install backend
        run: python -m pip install -e './server[test]'
      - name: Compile backend
        working-directory: server
        run: python -m compileall -q app tests
      - name: Run backend tests
        working-directory: server
        env:
          PYTHONPATH: .
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install frontend
        run: npm ci
      - name: Run visual contract tests
        run: npm run test:visual
      - name: Typecheck and build frontend
        run: npm run build
